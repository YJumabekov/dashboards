<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Прямой старт — введение</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background-color: #2C3E50;
      position: relative;
    }
    /* Full canvas is avatar zone — HeyGen places avatar here */
    .key-box {
      position: absolute;
      right: 60px;
      bottom: 80px;
      width: 420px;
      background: rgba(0, 0, 0, 0.70);
      border: 2px solid #E74C3C;
      border-radius: 8px;
      padding: 18px 20px;
    }
    .key-box .text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      font-size: 17pt;
      color: #FFFFFF;
      line-height: 1.55;
    }
    .logo {
      position: absolute;
      top: 24px; right: 36px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 13pt;
      color: #6AAF3D;
    }
  </style>
</head>
<body>
  <div class="key-box">
    <div class="text">Четыре вида ответственности. Могут наступить одновременно.</div>
  </div>
  <div class="logo">LOGO</div>
</body>
</html>
